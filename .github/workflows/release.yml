name: Build and publish Hootly

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) {
            throw "Release tag v$tagVersion must match package.json version $appVersion"
          }

      - name: Run application tests
        run: npm test

      - name: Type-check the application
        run: npm run typecheck

      - name: Build the app
        run: npm run build

      - name: Publish Windows installers to GitHub Releases
        run: npx electron-builder --win --config electron-builder.json --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
